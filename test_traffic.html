<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test 3D Cars Animation</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.31/"></script>
</head>
<body>
  <div id="viewDiv" style="width: 100vw; height: 100vh;"></div>
  <script>
    require([
      "esri/Map",
      "esri/views/SceneView",
      "esri/layers/GraphicsLayer",
      "esri/Graphic",
      "esri/geometry/Point",
      "esri/symbols/PointSymbol3D",
      "esri/symbols/ObjectSymbol3DLayer"
    ], function(Map, SceneView, GraphicsLayer, Graphic, Point, PointSymbol3D, ObjectSymbol3DLayer) {
      const graphicsLayer = new GraphicsLayer();
      const map = new Map({
        basemap: "osm",
        layers: [graphicsLayer]
      });

      const view = new SceneView({
        container: "viewDiv",
        map: map,
        camera: {
          position: { latitude: 33.666, longitude: -84.474, z: 400 },
          tilt: 60,
          heading: 320
        }
      });

      const carSymbol = new PointSymbol3D({
        symbolLayers: [
          new ObjectSymbol3DLayer({
            width: 2.2,
            height: 1.5,
            depth: 4.4,
            resource: { primitive: "cube" },
            material: { color: [248, 250, 252] },
            heading: 45
          })
        ]
      });

      const carGraphic = new Graphic({
        geometry: new Point({ latitude: 33.666, longitude: -84.474 }),
        symbol: carSymbol
      });

      graphicsLayer.add(carGraphic);
      window.testSuccess = true;
      console.log("3D Car Graphic created successfully!");
    });
  </script>
</body>
</html>
